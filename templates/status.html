<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=/static/style.css><main><h1>🗿 Estoy</h1><section><div class=ticket>{{visitor.ticket}}</div><h2>{{visitor.name}}さん</h2><p>{{visitor.menu}}</p>{% if visitor.status=='waiting' %}<div class=big>あと <b>{{(position-1) if position else 0}}</b> 組</div><p>このページは自動更新されます。</p>{% elif visitor.status=='called' %}<div class=notice>もうすぐ順番です。ブースへお越しください。</div>{% else %}<div class=notice>ありがとうございました。</div>{% endif %}</section></main><script>setTimeout(()=>location.reload(),20000)</script>
