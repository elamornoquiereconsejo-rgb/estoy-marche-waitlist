<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=/static/style.css><main class=wide><h1>🗿 Estoy 順番管理</h1><p>待ち {{n}} 組　<button onclick=next()>次の人を呼ぶ</button>　<a href=/admin/export.csv>CSV出力</a></p><p id=m></p><table><tr><th>番号</th><th>名前</th><th>メニュー</th><th>連絡</th><th>連絡先</th><th>状態</th></tr>{% for v in rows %}<tr><td>{{v.ticket}}</td><td>{{v.name}}</td><td>{{v.menu}}</td><td>{{v.contact_method}}</td><td>{{v.email or ('LINE連携済み' if v.line_user_id else 'LINE未連携')}}</td><td>{{v.status}} {% if v.status!='completed' %}<button onclick=done({{v.ticket}})>完了</button>{% endif %}</td></tr>{% endfor %}</table></main><script>async function next(){let d=await(await fetch('/admin/call-next',{method:'POST'})).json();m.textContent=d.ok?`受付${d.ticket}を呼び出しました。通知:${d.notified?'OK':'未送信'}`:(d.message||'エラー');setTimeout(()=>location.reload(),1200)}async function done(t){await fetch('/admin/complete/'+t,{method:'POST'});location.reload()}</script>
