<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=/static/style.css><title>Estoy マルシェ順番待ち</title><main><h1>🗿 Estoy マルシェ順番待ち</h1><p>お名前・お知らせ方法を入力してください。</p><form method=post action=/register><label>お名前<input name=name required></label><fieldset><legend>お知らせ方法</legend><div class=contact-options><label><input type=radio name=contact_method value=line required> <span>LINE</span></label><label><input type=radio name=contact_method value=email> <span>メール</span></label></div></fieldset><div id=e style="display:none"><label>メールアドレス<input type=email name=email></label></div><button>受付する</button></form></main><script>document.querySelectorAll('[name=contact_method]').forEach(x=>x.onchange=()=>e.style.display=document.querySelector('[name=contact_method]:checked').value==='email'?'block':'none')</script>
