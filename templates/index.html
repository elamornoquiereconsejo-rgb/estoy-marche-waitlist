<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=/static/style.css><title>Estoy マルシェ順番待ち</title><main><h1>🗿 Estoy マルシェ順番待ち</h1><p>お名前・メニュー・お知らせ方法を入力してください。</p><form method=post action=/register><label>お名前<input name=name required></label><label>メニュー<select name=menu required><option value="">選択</option><option>モアイ診断</option><option>潜在意識のセッション（キネシオロジーセッション）</option><option>アロマスプレー</option><option>その他</option></select></label><fieldset><legend>お知らせ方法</legend><label><input type=radio name=contact_method value=line required> LINE</label><label><input type=radio name=contact_method value=email> メール</label></fieldset><div id=e style="display:none"><label>メールアドレス<input type=email name=email></label></div><button>受付する</button></form></main><script>document.querySelectorAll('[name=contact_method]').forEach(x=>x.onchange=()=>e.style.display=document.querySelector('[name=contact_method]:checked').value==='email'?'block':'none')</script>
